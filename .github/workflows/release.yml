name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate package
        run: python scripts/validate_plugin.py --repo . --strict --expect-tag "$GITHUB_REF_NAME"
      - name: Build zip
        run: python scripts/build_zip.py --repo . --out dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ZIP="dist/disc_cleanup.zip"
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes "disc_cleanup $TAG 自动构建。sha256: $SHA"
          fi
